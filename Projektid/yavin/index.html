<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yavin – Office Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #3c56ff;
            --primary-dark: #1f2d75;
            --accent: #b51b6c;
            --text: #1d1f2b;
            --muted: #5d6073;
            --bg: #f8f9fd;
        }

        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(900px at 15% 20%, rgba(60, 86, 255, 0.08), transparent 55%),
                radial-gradient(700px at 90% 85%, rgba(181, 27, 108, 0.06), transparent 60%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .navbar {
            padding: 16px 0;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #7a6bff);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-right: 10px;
        }

        .nav-link {
            font-weight: 600;
            color: #5b5f73;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-dark);
        }

        .btn-outline-accent {
            color: var(--accent);
            border-color: var(--accent);
        }

        .btn-outline-accent:hover {
            color: #fff;
            background: var(--accent);
        }

        .hero {
            padding: 96px 0;
        }

        .hero h1 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.5px;
        }

        .hero h1 .highlight {
            color: var(--primary);
        }

        .hero p {
            color: var(--muted);
            max-width: 520px;
        }

        .dot-field {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(60, 86, 255, 0.08) 0 3px, transparent 3px),
                radial-gradient(circle at 80% 80%, rgba(60, 86, 255, 0.08) 0 3px, transparent 3px);
            background-size: 60px 60px, 60px 60px;
        }

        .hero-card {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(27, 33, 68, 0.15);
        }

        .hero-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .overlay-thumb {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 180px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
            border: 6px solid #fff;
        }

        @media (max-width: 991px) {
            body {
                padding-top: 72px;
            }

            .hero {
                padding: 72px 0;
            }

            .hero h1 {
                font-size: 2.4rem;
            }

            .overlay-thumb {
                width: 150px;
            }
        }
    </style>
</head>

<body>
    <div class="dot-field"></div>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <span class="brand-mark">Y</span> Yavin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav me-3">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
                </ul>
                <a class="btn btn-outline-accent fw-semibold rounded-pill px-3" href="#">Contact Us</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container position-relative">
            <div class="row align-items-center g-5">
                <div class="col-lg-6">
                    <h1 class="display-4 mb-3">The <span class="highlight">Perfect</span><br>Office Space</h1>
                    <p class="lead mb-4">
                        We specialize in transforming office spaces into inspiring and functional environments.
                        Let us bring your vision to life.
                    </p>
                    <div class="d-flex gap-3">
                        <a class="btn btn-primary btn-lg px-4 rounded-pill" href="#">More details</a>
                        <a class="btn btn-outline-accent btn-lg px-4 rounded-pill" href="#">Contact us</a>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="hero-card">
                        <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1000&q=80"
                            alt="Minimalist white desk with laptop and lamp">
                        <div class="overlay-thumb">
                            <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=500&q=80"
                                alt="Designer working on a laptop">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
