<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lihtne Bootstrap 5 leht</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 72px;
        }

        /* ruum fikseeritud navbari jaoks */
        .hero-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">MinuLogo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
                aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navMenu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">Avaleht</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Teenused</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Kontakt</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="py-5">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-lg-6">
                    <h1 class="display-5 fw-bold mb-3">Leia motivatsioon ja tee järgmine samm</h1>
                    <p class="lead mb-4">Kiire ülevaade sinu teenusest või ideest. Lühike ja konkreetne kirjeldus, mis
                        kutsub lugema.</p>
                    <a class="btn btn-primary btn-lg" href="#">Rohkem infot</a>
                </div>
                <div class="col-lg-6 text-center">
                    <img class="hero-img" src="https://via.placeholder.com/720x480?text=Pilt" alt="Hero pilt">
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
