<!doctype html>
<html lang="et">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 – Esimene leht</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .toggle-circle {
      width: 24px;
      height: 24px;
      background: #333;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }

    #modeSwitch:checked+label .toggle-circle {
      transform: translateX(20px);
      background: #fff;
    }
  </style>

</head>

<body>
  <div class="container">
    <h1>Nupud</h1>

    <button type="button" class="btn">Minu nupp</button>
    <br><br>
    <!-- Styles -->
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-dark">Dark</button>
    <button class="btn btn-link">Link</button>

    <br><br>
    <button class="btn btn-primary">Nupp</button>
    <a href="#" class="btn btn-primary">Link-nupp</a>
    <input type="submit" class="btn btn-primary" value="Saada">

    <br><br>
    <!-- Button Sizes -->
    <button class="btn btn-primary btn-lg">Suur</button>
    <button class="btn btn-primary">Tavaline</button>
    <button class="btn btn-primary btn-sm">Väike</button>

    <br><br>

    <!-- Button States -->
    <button class="btn btn-primary">Tavaline</button>
    <button class="btn btn-primary disabled">Keelatud</button>
    <button class="btn btn-primary active">Aktiivne</button>

    <br><br>

    <!-- Outline Buttons -->
    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-outline-secondary">Secondary</button>
    <button class="btn btn-outline-success">Success</button>
    <button class="btn btn-outline-danger">Danger</button>
    <button class="btn btn-outline-warning">Warning</button>
    <button class="btn btn-outline-info">Info</button>
    <button class="btn btn-outline-light">Light</button>
    <button class="btn btn-outline-dark">Dark</button>

    <br><br>

    <!-- Links Formatted as Buttons -->
    <a href="#" class="btn btn-primary">Link Button</a>
    <a href="#" class="btn btn-primary btn-lg">Link Button</a>
    <a href="#" class="btn btn-primary disabled">Link Button</a>

    <br><br>

    <!-- Täislaiuses nupud -->
    <button class="btn btn-success w-100">Täislaiuses nupp</button>
    <br>
    <br>
    <div class="d-grid gap-2">
      <button class="btn btn-primary">Saada</button>
      <button class="btn btn-danger">Loobu</button>
    </div>
    <br><br>


    <br><br>

    <!-- Button Group -->
    <div class="btn-group" role="group">
      <button class="btn btn-primary">Vasak</button>
      <button class="btn btn-primary">Keskmine</button>
      <button class="btn btn-primary">Keskmine</button>
      <button class="btn btn-primary">Keskmine</button>
      <button class="btn btn-primary">Parem</button>
    </div>

    <br><br>

    <div class="btn-group-vertical" role="group">
      <button class="btn btn-primary">Vasak</button>
      <button class="btn btn-primary">Keskmine</button>
      <button class="btn btn-primary">Keskmine</button>
      <button class="btn btn-primary">Keskmine</button>
      <button class="btn btn-primary">Parem</button>
    </div>

    <br><br>

    <!-- Button Toolbar -->
    <div class="btn-toolbar" role="toolbar">
      <div class="btn-group me-3" role="group">
        <button class="btn btn-primary">1</button>
        <button class="btn btn-secondary">2</button>
        <button class="btn btn-primary">3</button>
      </div>

      <div class="btn-group" role="group">
        <button class="btn btn-primary">4</button>
        <button class="btn btn-secondary">5</button>
        <button class="btn btn-primary">6</button>
      </div>
    </div>

    <br><br>
    <!-- Toggle nupp -->
    <button class="btn btn-primary" data-bs-toggle="button">Toggle nupp</button>

    <br><br>
    <!-- checkboxid  -->
    <div class="btn-group" role="group">
      <input type="checkbox" class="btn-check" id="btncheck1" autocomplete="off">
      <label class="btn btn-outline-primary" for="btncheck1">Checkbox 1</label>

      <input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off">
      <label class="btn btn-outline-primary" for="btncheck2">Checkbox 2</label>

      <input type="checkbox" class="btn-check" id="btncheck3" autocomplete="off">
      <label class="btn btn-outline-primary" for="btncheck3">Checkbox 3</label>
    </div>
    <br><br>
    <!-- raadio nuppude grupp  -->
    <div class="btn-group" role="group">
      <input type="radio" class="btn-check" name="options" id="option1" autocomplete="off">
      <label class="btn btn-outline-primary" for="option1">Raadio 1</label>

      <input type="radio" class="btn-check" name="options" id="option2" autocomplete="off">
      <label class="btn btn-outline-primary" for="option2">Raadio 2</label>

      <input type="radio" class="btn-check" name="options" id="option3" autocomplete="off">
      <label class="btn btn-outline-primary" for="option3">Raadio 3</label>
    </div>
    <br><br>
    <br><br>
    <br><br>
    <!-- Dropdown Button -->
    <div class="dropdown">
      <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
        Dropdown Button
      </button>
      <ul class="dropdown-menu">
        <li><a href="#" class="dropdown-item">Link 1</a></li>
        <li><a href="#" class="dropdown-item">Link 2</a></li>
        <li><a href="#" class="dropdown-item">Link 3</a></li>
      </ul>
    </div>

    <br><br><br><br>
    <!-- Nupp koos laadimisolekuga -->
    <button class="btn btn-primary" type="button" disabled>
      <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Laadimine...
    </button>
    <br><br><br><br>

    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="themeSwitch">
      <label class="form-check-label" for="themeSwitch">
        <i class="bi bi-sun"></i>
      </label>
    </div>
    <br><br><br><br>
    <input type="checkbox" class="btn-check" id="modeSwitch" autocomplete="off">
    <label class="btn btn-light d-flex align-items-center px-3 py-2 rounded-pill" for="modeSwitch">
      <i class="bi bi-sun me-2"></i>
      <span class="toggle-circle"></span>
    </label>



  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
