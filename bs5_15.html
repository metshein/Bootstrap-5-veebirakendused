<!doctype html>
<html lang="et">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 – Esimene leht</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <h1 class="mb-5">Forms & Input</h1>

    <!-- Basic Form -->
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Salasõna</label>
        <input type="password" class="form-control" />
      </div>
      <div class="mb-3">
        <input type="checkbox" class="form-check-input" id="remember" />
        <label for="remember" class="form-check-label">Pea meeles mind</label>
      </div>
      <input type="submit" value="Logi sisse" class="btn btn-primary" />
    </form>

    <br><br>
    <input type="text" class="form-control">
    <input type="email" class="form-control">
    <input type="password" class="form-control">
    <input type="number" class="form-control">
    <input type="date" class="form-control">
    <br><br>

    <!-- Other Fields -->
    <form>
      <!-- Select Fields -->
      <div class="mb-3">
        <select class="form-select">
          <option>Hommik</option>
          <option>Pärastlõuna</option>
          <option>Õhtu</option>
        </select>
      </div>
      <br><br><br><br>
      <!-- Textarea -->
      <div class="mb-3">
        <textarea class="form-control" placeholder="Message"></textarea>
      </div>

      <!-- Switch -->
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="switch1">
        <label class="form-check-label" for="switch1">Aktiivne</label>
      </div>
      <br><br>
      <!-- Inline Checkboxes -->
      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input" id="ch1" value="option1" />
          <label for="ch1" class="form-check-label">Valik 1</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input" id="ch2" value="option2" />
          <label for="ch2" class="form-check-label">Valik 2</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="checkbox" class="form-check-input" id="ch3" value="option3" />
          <label for="ch3" class="form-check-label">Valik 3</label>
        </div>
      </div>
      <!-- raadionupud -->
      <div class="mb-3">
        <div class="form-check form-check-inline">
          <input type="radio" class="form-check-input" id="r1" name="options" value="option1" />
          <label for="r1" class="form-check-label">Raadio 1</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" class="form-check-input" id="r2" name="options" value="option2" />
          <label for="r2" class="form-check-label">Raadio 2</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" class="form-check-input" id="r3" name="options" value="option3" />
          <label for="r3" class="form-check-label">Raadio 3</label>
        </div>
      </div>
      <br><br>
      <!-- Toggle Button -->
      <div class=" mb-3">
        <input type="checkbox" class="btn-check" id="btn-check" />
        <label class="btn btn-danger" for="btn-check">Button Toggle</label>
      </div>

      <!-- Liugur -->
      <div class="mb-3">
        <label for="range" class="form-label"></label>
        <input type="range" class="form-range" id="range" />
      </div>

      <!-- Liuguri sammud -->
      <div class="mb-3">
        <label for="range" class="form-label"></label>
        <input type="range" class="form-range" id="range" min="0" max="5" step="0.5" />
      </div>
    </form>

    <!-- Input Groups -->
    <form>
      <div class="input-group mb-3">
        <span class="input-group-text">@</span>
        <input type="email" class="form-control" placeholder="Email" />
      </div>
    </form>

    <br><br>

    <form>
      <div class="input-group">
        <input type="text" class="form-control" />
        <button class="btn btn-outline-secondary">Submit</button>
      </div>
    </form>
    <br><br>
    <!-- ujuvad sildid -->
    <div class="form-floating">
      <input type="email" class="form-control" placeholder="E-post">
      <label for="email">E-post</label>
    </div>

  </div>
  <div style="margin-top: 350px"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
