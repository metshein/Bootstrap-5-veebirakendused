<!doctype html>
<html lang="et">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 – Esimene leht</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <h1 class="mb-5">Forms & Input</h1>

    <!-- Basic Form -->
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Salasõna</label>
        <input type="password" class="form-control" />
      </div>
      <div class="mb-3">
        <input type="checkbox" class="form-check-input" id="remember" />
        <label for="remember" class="form-check-label">Pea meeles mind</label>
      </div>
      <input type="submit" value="Logi sisse" class="btn btn-primary" />
    </form>

    <br><br>
    <!-- grid paigutamine -->
    <form>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="firstName" class="form-label">Eesnimi</label> <input type="text" class="form-control"
            id="firstName">
        </div>
        <div class="col-md-6 mb-3"> <label for="lastName" class="form-label">Perekonnanimi</label>
          <input type="text" class="form-control" id="lastName">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Saada</button>
    </form>
    <br><br>
    <!-- horisontaalne vorm -->
    <form class="row g-3 align-items-center">
      <div class="col-auto">
        <label for="inputEmail" class="col-sm-3 col-form-label">Email:</label>
      </div>
      <div class="col-auto">
        <input type="email" id="inputEmail" class="form-control" aria-describedby="emailHelp">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary mb-3">Saada</button>
      </div>
    </form>
    <br><br>
    <!-- mitme rea kombineerimine -->
    <form>
      <div class="row">
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" placeholder="Eesnimi">
        </div>
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" placeholder="Perekonnanimi">
        </div>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email">
      </div>
      <div class="row">
        <div class="col-md-8 mb-3">
          <input type="text" class="form-control" placeholder="Tänav">
        </div>
        <div class="col-md-4 mb-3">
          <input type="text" class="form-control" placeholder="Maja nr">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Registreeru</button>
    </form>

    <br><br>

    <!-- inline paigutus -->
    <form class="row row-cols-lg-auto g-3 align-items-center">
      <div class="col-12">
        <label for="inlineFormInput" class="visually-hidden">Nimi</label>
        <input type="text" class="form-control" id="inlineFormInput" placeholder="Nimi">
      </div>
      <div class="col-12">
        <label for="inlineFormSelectPref" class="visually-hidden">Eelistus</label>
        <select class="form-select" id="inlineFormSelectPref">
          <option selected>Vali...</option>
          <option value="1">Töötaja</option>
          <option value="2">Juht</option>
          <option value="3">Muu</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Saada</button>
      </div>

      <br><br>
  </div>
  <div style="margin-top: 350px"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
