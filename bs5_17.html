<!doctype html>
<html lang="et">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 – Esimene leht</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <h1 class="mb-5">Vormide valideerimine</h1>

    <!-- Basic Form -->
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Salasõna</label>
        <input type="password" class="form-control" id="password" required minlength="6">
      </div>
      <input type="submit" value="Logi sisse" class="btn btn-primary">
    </form>

    <br><br>

    <form class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="kasutajanimi" class="form-label">Kasutajanimi</label>
        <input type="text" class="form-control" required id="kasutajanimi">
        <div class="invalid-feedback"> Kasutajanimi on kohustuslik. </div>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" required>
        <label class="form-check-label"> Nõustun tingimustega </label>
        <div class="invalid-feedback"> Pead tingimustega nõustuma. </div>
      </div>
      <input type="submit" value="Registreeri" class="btn btn-success">
    </form>

    <br><br>



    <br><br>
  </div>
  <div style="margin-top: 350px"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

    const nimi = document.getElementById("kasutajanimi")
    nimi.addEventListener("input", () => {
      if (nimi.value.length < 3) {
        nimi.classList.add("is-invalid")
        nimi.classList.remove("is-valid")
      } else {
        nimi.classList.remove("is-invalid")
        nimi.classList.add("is-valid")
      }
    }) 
  </script> -->
  <script>
    (() => {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')

      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>


</body>

</html>
