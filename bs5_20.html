<!doctype html>
<html lang="et">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 5 – Esimene leht</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container">
    <h1>Badges</h1>
    <p>
      <span class="badge bg-primary">Peamine</span>
      <span class="badge bg-secondary">Teine</span>
      <span class="badge bg-success">Edukas</span>
      <span class="badge bg-danger">Ohtlik</span>
      <span class="badge bg-warning text-dark">Hoiatus</span>
      <span class="badge bg-info text-dark">Teave</span>
      <span class="badge bg-light text-dark">Hele</span>
      <span class="badge bg-dark">Tume</span>
    </p>
    <h2>Märgise suurused</h2>

    <h1>Postkast <span class="badge text-bg-primary">12</span></h1>
    <h2>Postkast <span class="badge text-bg-primary">12</span></h2>
    <h3>Postkast <span class="badge text-bg-primary">12</span></h3>
    <h4>Postkast <span class="badge text-bg-primary">12</span></h4>
    <h5>Postkast <span class="badge text-bg-primary">12</span></h5>
    <h6>Postkast <span class="badge text-bg-primary">12</span></h6>

    <h2>Märgis nupu sees</h2>
    <button class="btn btn-success">
      Nupp <span class="badge bg-light text-dark">12</span>
    </button>

    <h2>Ümar märgis</h2>
    <span class="badge rounded-pill bg-primary">Peamine</span>
    <span class="badge rounded-pill bg-secondary">Teine</span>

    <h2 class="mb-4">Märgise postitsioneerimine</h2>

    <button type="button" class="btn btn-info position-relative">
      Sõnumid
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        99+
        <span class="visually-hidden">mitte loetavad sõnumid</span>
      </span>
    </button>
    <br><br>
    <button type="button" class="btn btn-primary position-relative">
      Profiil
      <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
        <span class="visually-hidden">Uus teade</span>
      </span>
    </button>

    <h1>Progressbar</h1>
    <div class="progress mb-2" role="progressbar" aria-label="Basic example" aria-valuenow="0" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar" style="width: 0%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Basic example" aria-valuenow="25" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar" style="width: 25%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Basic example" aria-valuenow="50" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar" style="width: 50%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Basic example" aria-valuenow="75" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar" style="width: 75%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Basic example" aria-valuenow="100" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar" style="width: 100%"></div>
    </div>


    <div class="progress mb-2" role="progressbar" aria-label="Example with label" aria-valuenow="60" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar" style="width: 60%">60%</div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Tall example" aria-valuenow="40" aria-valuemin="0"
      aria-valuemax="100" style="height: 25px;">
      <div class="progress-bar" style="width: 40%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Success example" aria-valuenow="75" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar bg-success" style="width: 75%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Warning example" aria-valuenow="50" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar bg-warning" style="width: 50%"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Danger example" aria-valuenow="25" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar bg-danger" style="width: 25%"></div>
    </div>

    <div class="progress mb-2">
      <div class="progress-bar text-bg-success" style="width: 30%;"></div>
      <div class="progress-bar text-bg-warning" style="width: 20%;"></div>
      <div class="progress-bar text-bg-danger" style="width: 10%;"></div>
    </div>

    <div class="progress mb-2" role="progressbar" aria-label="Striped example" aria-valuenow="60" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar progress-bar-striped" style="width: 60%"></div>
    </div>

    <div class="progress" role="progressbar" aria-label="Animated example" aria-valuenow="60" aria-valuemin="0"
      aria-valuemax="100">
      <div class="progress-bar progress-bar-striped progress-bar-animated " style="width: 60%"></div>
    </div>


  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
